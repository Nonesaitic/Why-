<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video của tôi</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
  @custom-variant dark (&:where(.dark, .dark *));
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-white dark:bg-neutral-950 text-neutral-900 dark:text-white font-sans transition-colors">

  <!-- Navbar -->
  <nav class="sticky top-0 z-40 bg-white/90 dark:bg-neutral-950/90 backdrop-blur border-b border-neutral-200 dark:border-neutral-800">
    <div class="max-w-3xl mx-auto flex items-center gap-3 px-4 py-3">
      <div class="flex items-center gap-2 font-semibold text-base shrink-0">
        <i class="fa-solid fa-clapperboard text-red-600"></i>
        <span>MyTube</span>
      </div>

      <div class="flex-1 relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-neutral-400 text-sm"></i>
        <input id="searchInput" type="text" placeholder="Tìm video theo tên"
          class="w-full bg-neutral-100 dark:bg-neutral-800 text-sm rounded-full pl-9 pr-3 py-2
          outline-none focus:ring-1 focus:ring-red-600 placeholder:text-neutral-400">
      </div>

      <button id="themeToggle" class="shrink-0 w-9 h-9 rounded-full flex items-center justify-center
        hover:bg-neutral-100 dark:hover:bg-neutral-800 transition">
        <i id="themeIcon" class="fa-solid fa-moon text-sm"></i>
      </button>
    </div>
  </nav>

  <main class="max-w-3xl mx-auto p-4">

    <!-- Form thêm video -->
    <div class="flex flex-col gap-2 mb-5">
      <input id="nameInput" type="text" placeholder="Đặt tên cho video (không bắt buộc)"
        class="bg-neutral-100 dark:bg-neutral-800 text-sm rounded-lg px-3 py-2 outline-none
        focus:ring-1 focus:ring-red-600 placeholder:text-neutral-400">
      <div class="flex gap-2">
        <input id="linkInput" type="text" placeholder="Dán link YouTube hoặc .mp4"
          class="flex-1 bg-neutral-100 dark:bg-neutral-800 text-sm rounded-lg px-3 py-2 outline-none
          focus:ring-1 focus:ring-red-600 placeholder:text-neutral-400">
        <button id="addBtn" class="bg-red-600 hover:bg-red-700 transition text-white text-sm px-4 rounded-lg shrink-0">
          Lưu
        </button>
      </div>
      <p id="errorMsg" class="text-red-500 text-xs hidden"></p>
    </div>

    <!-- Danh sách video -->
    <h2 class="text-sm font-semibold text-neutral-500 dark:text-neutral-400 mb-2">Video đã lưu</h2>
    <div id="linkList" class="flex flex-col gap-2 mb-6"></div>

    <!-- Player mp4 custom -->
    <div id="player" class="hidden max-w-xl mx-auto">
      <div id="playerBox" class="relative w-full">
        <video id="videoTag" class="w-full block bg-black rounded-lg"></video>

        <div id="leftTap" class="absolute top-0 bottom-16 left-0 w-1/3"></div>
        <div id="rightTap" class="absolute top-0 bottom-16 right-0 w-1/3"></div>

        <div id="seekFlash" class="hidden absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2
          bg-black/60 text-white px-4 py-2 rounded-full text-sm items-center gap-2 pointer-events-none">
          <i id="seekIcon" class="fa-solid fa-backward"></i> <span id="seekText">10s</span>
        </div>

        <div id="controls" class="absolute left-0 right-0 bottom-0 bg-gradient-to-t from-black/85 to-transparent
          px-3 pt-6 pb-2 transition-opacity duration-200 rounded-b-lg">
          <input id="seek" type="range" min="0" max="100" value="0" step="0.1"
            class="w-full accent-red-600 cursor-pointer h-1">
          <div class="flex items-center gap-4 mt-1">
            <button id="playBtn" class="text-white text-base hover:text-red-500 transition">
              <i class="fa-solid fa-play"></i>
            </button>
            <button id="back10" class="text-white text-sm hover:text-red-500 transition">
              <i class="fa-solid fa-rotate-left"></i>
            </button>
            <button id="fwd10" class="text-white text-sm hover:text-red-500 transition">
              <i class="fa-solid fa-rotate-right"></i>
            </button>
            <span id="time" class="text-xs text-neutral-300">0:00 / 0:00</span>
            <input id="volume" type="range" min="0" max="1" step="0.05" value="1"
              class="w-14 accent-red-600 ml-auto h-1">
          </div>
        </div>
      </div>
    </div>

    <!-- Player YouTube nhúng -->
    <div id="ytWrap" class="hidden max-w-xl mx-auto">
      <div class="aspect-video w-full rounded-lg overflow-hidden bg-black">
        <iframe id="ytFrame" class="w-full h-full" src="" frameborder="0"
          allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
      </div>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
